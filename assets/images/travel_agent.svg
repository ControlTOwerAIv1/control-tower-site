<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="AI travel booking agent illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1024"/>
      <stop offset="1" stop-color="#1d3a8a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="ai" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <circle cx="620" cy="120" r="220" fill="url(#glow)"/>

  <!-- flight route -->
  <path d="M90 470 C 240 330, 420 420, 700 180" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 8" opacity="0.7"/>
  <circle cx="90" cy="470" r="7" fill="#38bdf8"/>
  <circle cx="700" cy="180" r="7" fill="#a78bfa"/>
  <text x="70" y="505" fill="#cbd5e1" font-family="monospace" font-size="16">BOM</text>
  <text x="675" y="165" fill="#cbd5e1" font-family="monospace" font-size="16">DXB</text>
  <g transform="translate(395 300) rotate(-28)">
    <path d="M0 -14 L10 0 L0 14 L-4 4 L-16 8 L-14 0 L-16 -8 L-4 -4 Z" fill="#ffffff"/>
  </g>

  <!-- chat panel -->
  <rect x="90" y="110" width="330" height="250" rx="22" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.18"/>
  <circle cx="122" cy="142" r="14" fill="url(#ai)"/>
  <text x="146" y="147" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="700">AI Travel Agent</text>
  <text x="146" y="165" fill="#34d399" font-family="sans-serif" font-size="12">● online · 24/7</text>

  <rect x="150" y="186" width="250" height="52" rx="16" fill="#ffffff" fill-opacity="0.9"/>
  <text x="168" y="208" fill="#0f172a" font-family="sans-serif" font-size="14">Mumbai to Dubai next Friday,</text>
  <text x="168" y="226" fill="#0f172a" font-family="sans-serif" font-size="14">window seat, under ₹30k</text>

  <rect x="110" y="252" width="270" height="72" rx="16" fill="#1e40af" fill-opacity="0.75"/>
  <text x="128" y="277" fill="#ffffff" font-family="sans-serif" font-size="14">Found 6 options. Booked the best fit</text>
  <text x="128" y="297" fill="#ffffff" font-family="sans-serif" font-size="14">✓ Ticket sent to your WhatsApp</text>
  <text x="128" y="314" fill="#bfdbfe" font-family="monospace" font-size="12">PNR 7KD92X · Seat 14A</text>

  <!-- boarding pass -->
  <rect x="470" y="330" width="260" height="150" rx="16" fill="#ffffff" fill-opacity="0.95"/>
  <rect x="470" y="330" width="260" height="34" rx="16" fill="url(#ai)"/>
  <text x="490" y="353" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">BOARDING PASS</text>
  <text x="490" y="396" fill="#0f172a" font-family="monospace" font-size="22" font-weight="700">BOM → DXB</text>
  <text x="490" y="420" fill="#475569" font-family="sans-serif" font-size="12">Fri · 06:40 · Gate B12 · Seat 14A</text>
  <line x1="490" y1="436" x2="710" y2="436" stroke="#94a3b8" stroke-dasharray="4 4"/>
  <rect x="490" y="446" width="70" height="20" rx="4" fill="#0f172a"/>
  <text x="497" y="461" fill="#ffffff" font-family="monospace" font-size="11">▮▮▮▮▮▮▮▮</text>

  <!-- refund badge -->
  <rect x="90" y="400" width="250" height="56" rx="16" fill="#0f172a" fill-opacity="0.7" stroke="#34d399" stroke-opacity="0.5"/>
  <text x="112" y="425" fill="#34d399" font-family="sans-serif" font-size="14" font-weight="700">Refund approved</text>
  <text x="112" y="444" fill="#cbd5e1" font-family="sans-serif" font-size="12">₹4,200 back to original card</text>
</svg>
